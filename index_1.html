<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hồ Anh Bình – Dữ liệu và tự động hóa cho năng suất</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<style>
:root{
  --navy:#0B2A5B; --navy-2:#143A7A; --blue-ink:#0B2A5B;
  --bg:#FFFFFF; --surface:#F3F4F6; --text:#111111; --muted:#4B5563; --line:#E1E4EA;
  --head:#111111; color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{--bg:#0A1426;--surface:#101E38;--text:#E6EBF5;--muted:#9FAAC2;--line:#22345A;--head:#FFFFFF;--navy:#2F5FB3;--navy-2:#4A78C8;--blue-ink:#8DB2F2;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 "Be Vietnam Pro",system-ui,"Segoe UI",Arial,sans-serif}
a{color:inherit;text-decoration:none}
h1,h2,h3{color:var(--head);line-height:1.25;margin:0 0 .5em}
h1{font-size:34px;font-weight:800}h2{font-size:24px;font-weight:800}h3{font-size:16px;font-weight:700}
p{margin:0 0 1em}
:focus-visible{outline:3px solid var(--blue-ink);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ===== MODULE: header ===== */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);color:var(--text);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;background:var(--navy);display:inline-block;border-radius:2px}
.nav{display:flex;gap:4px;align-items:center}
.nav a,.nav button{color:inherit;background:none;border:0;font:inherit;padding:8px 12px;border-radius:6px;cursor:pointer}
.nav a:hover,.nav button:hover,.nav a.on{background:var(--surface)}
.nav a.on{box-shadow:inset 0 -3px 0 var(--navy);border-radius:6px 6px 0 0}
.dd{position:relative}
.dd-menu{display:none;position:absolute;left:0;top:100%;min-width:320px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:0 0 8px 8px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.dd:hover .dd-menu,.dd.open .dd-menu,.dd:focus-within .dd-menu{display:block}
.dd-menu a{display:block;color:var(--text)}
.dd-menu a:hover{background:var(--surface)}
.burger{display:none}

/* ===== MODULE: hero ===== */
.hero{background:var(--surface);color:var(--text);padding:64px 0 72px;border-bottom:1px solid var(--line)}
.hero-in{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}
.hero h1{max-width:760px}
.hero p{max-width:620px;font-size:16px;color:var(--muted)}
.art{color:var(--blue-ink);width:100%;max-width:340px;justify-self:center}
.video{width:100%}
.video .frame{position:relative;aspect-ratio:16/9;background:var(--bg);border:2px solid var(--navy);border-radius:8px;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .ph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;color:var(--blue-ink);text-align:center;padding:16px}
.video .ph svg{width:56px;height:56px}
.video .ph span{color:var(--muted)}
.video .alt-link{display:inline-block;margin-top:8px;font-weight:700;color:var(--blue-ink);border-bottom:2px solid var(--navy)}
.hero.sm{padding:48px 0 52px}
.hero.sm h1{font-size:28px}

/* ===== MODULE: button ===== */
.btn{display:inline-block;padding:11px 22px;border-radius:6px;font-weight:700;border:2px solid var(--navy);background:var(--navy);color:#fff;margin:4px 10px 4px 0}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--blue-ink);border-color:var(--navy)}

/* ===== MODULE: section / cards / steps / faq / cta ===== */
.sec{padding:56px 0}.sec.alt{background:var(--surface)}
.sec-head{max-width:640px;margin-bottom:28px}
.sec-head p{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{display:block;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:6px;padding:20px}
.alt .card{background:var(--bg)}
a.card:hover{border-color:var(--navy-2);border-left-color:var(--navy);transform:translateY(-2px);transition:transform .15s}
.card p{color:var(--muted);margin:0}
.card .more{display:inline-block;margin-top:10px;font-weight:700;color:var(--blue-ink);border-bottom:2px solid var(--navy)}
.steps{counter-reset:s;display:grid;gap:14px;max-width:720px}
.step{display:flex;gap:16px;align-items:flex-start}
.step::before{counter-increment:s;content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 3px var(--line)}
.step p{margin:0;color:var(--muted)}
.faq{max-width:760px}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}
.faq summary{font-weight:700;cursor:pointer;color:var(--head)}
.faq p{margin:8px 0 0;color:var(--muted)}
.cta{background:var(--surface);color:var(--text);padding:48px 0;border-top:1px solid var(--line)}
.cta p{color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px}

/* ===== MODULE: footer (3 cột) ===== */
.ftr{background:var(--surface);color:var(--text);padding:44px 0 20px;border-top:1px solid var(--line)}
.ftr .cols{display:grid;grid-template-columns:1.3fr 1.2fr 1fr;gap:32px}
.ftr h3{color:var(--blue-ink);font-size:15px}
.ftr ul{list-style:none;margin:0;padding:0}.ftr li{margin-bottom:6px}
.ftr a:hover{color:var(--blue-ink);text-decoration:underline}
.ftr .copy{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

@media(max-width:820px){
  h1{font-size:27px}.hero{padding:48px 0 54px}
  .burger{display:block;background:none;border:2px solid var(--line);color:var(--text);border-radius:6px;padding:6px 10px;font:inherit}
  .nav{display:none;position:absolute;left:0;right:0;top:60px;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:8px 20px 16px}
  .nav.open{display:flex}
  .dd-menu{position:static;display:block;border:0;border-left:3px solid var(--navy);box-shadow:none;background:transparent;color:inherit;min-width:0;margin-left:12px;padding:0}
  .dd-menu a{color:var(--text)}.dd-menu a:hover{background:var(--surface)}
  .split,.ftr .cols,.hero-in{grid-template-columns:1fr}
  .art{max-width:240px;justify-self:start}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hdr"><div class="wrap">
  <a class="brand" href="#/"><i></i><span id="brand"></span></a>
  <button class="burger" id="burger" aria-label="Mở menu">Menu</button>
  <nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>
</div></header>

<main id="app"></main>
<footer class="ftr" id="footer"></footer>

<script>
/* =====================================================================
   CẤU HÌNH CHUNG (sửa 1 lần, áp dụng toàn site)
   ===================================================================== */
const SITE = {
  name: "Hồ Anh Bình",
  about: "Chia sẻ cách tôi đã ứng dụng dữ liệu và tự động hóa để giảm công việc thủ công, nâng cao năng suất.",
  email: "hoanhbinhxd@gmail.com",
  phone: "0989985253",
  video: "" // Dán link hoặc ID video YouTube giới thiệu vào đây, ví dụ "https://www.youtube.com/watch?v=XXXXXXXXXXX"
};
const FREE = [
  { id:"so-hoa-du-lieu",   title:"Số hóa dữ liệu để tăng năng suất",
    desc:"Chuyển việc ghi chép thủ công sang dữ liệu có cấu trúc để theo dõi và ra quyết định nhanh hơn." },
  { id:"ai-quan-tri",      title:"Ứng dụng AI quản trị cho người mới",
    desc:"Dùng AI để soạn báo cáo, tổng hợp số liệu và theo dõi công việc mà không cần biết lập trình." },
  { id:"khoi-nghiep",      title:"Khởi nghiệp đổi mới sáng tạo cho người mới",
    desc:"Từ ý tưởng đến thử nghiệm đầu tiên: kiểm chứng nhu cầu với chi phí thấp." },
  { id:"ky-nang-ban-hang", title:"Kỹ năng bán hàng cho người mới",
    desc:"Cách tìm hiểu khách hàng, trình bày giá trị và chốt đơn một cách tự nhiên." },
  { id:"mo-hinh-trai-nghiem", title:"Kinh nghiệm vận hành mô hình trải nghiệm sản phẩm",
    desc:"Thiết kế và vận hành không gian để khách hàng dùng thử trực tiếp trước khi mua." }
];
/* GẮN LINK TRANG CON: dán đường dẫn vào từng dòng dưới đây khi đã thiết kế xong trang.
   Để trống thì bấm vào link sẽ không làm gì. */
const LINKS = {
  "so-hoa-du-lieu": "/toi-uu-nang-suat-nhan-vien.html",
  "ai-quan-tri": "",
  "khoi-nghiep": "",
  "ky-nang-ban-hang": "",
  "mo-hinh-trai-nghiem": ""
};
const link = f => LINKS[f.id] || "#";
const MENU = [
  {label:"Trang chủ", href:"#/"},
  {label:"Giới thiệu", href:"#/gioi-thieu"},
  {label:"Chia sẻ miễn phí", href:"#/chia-se", children: FREE.map(f=>({label:f.title, href:link(f)}))},
  {label:"Liên hệ", href:"#/lien-he"}
];

/* =====================================================================
   THƯ VIỆN MODULE (không cần sửa) – mỗi module nhận 1 object dữ liệu
   ===================================================================== */
const ART = `<svg class="art" viewBox="0 0 360 260" role="img" aria-label="Minh họa dữ liệu và tự động hóa">
<rect x="20" y="20" width="230" height="170" rx="10" fill="none" stroke="currentColor" stroke-width="3"/>
<rect x="46" y="120" width="28" height="48" fill="currentColor"/>
<rect x="88" y="96" width="28" height="72" fill="currentColor" opacity=".75"/>
<rect x="130" y="70" width="28" height="98" fill="currentColor" opacity=".55"/>
<rect x="172" y="46" width="28" height="122" fill="currentColor" opacity=".35"/>
<path d="M250 105H300V190" fill="none" stroke="currentColor" stroke-width="3"/>
<circle cx="300" cy="105" r="12" fill="currentColor"/>
<path d="M50 230H310" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="6 6"/>
<circle cx="50" cy="230" r="12" fill="currentColor"/><circle cx="180" cy="230" r="12" fill="currentColor"/><circle cx="310" cy="230" r="12" fill="currentColor"/>
</svg>`;
const ytId = v => { v = String(v||""); const m = v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(v) ? v : ""); };
const VIDEO = () => { const id = ytId(SITE.video);
  return `<div class="video"><div class="frame">${id
    ? `<iframe src="https://www.youtube-nocookie.com/embed/${id}" title="Video giới thiệu ${SITE.name}" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`
    : `<div class="ph"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="3"/><path d="M26 20L46 32L26 44Z" fill="currentColor"/></svg><strong>Video giới thiệu</strong><span>Dán link YouTube vào SITE.video</span></div>`}</div>
  ${id ? `<a class="alt-link" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Mở video trên YouTube</a>` : ""}</div>`; };
const M = {
  hero: d => `<section class="hero ${d.small?'sm':''}"><div class="wrap"><div class="${(d.art||d.video)?'hero-in':''}"><div>
      <h1>${d.title}</h1><p>${d.text}</p>
      ${(d.buttons||[]).map((b,i)=>`<a class="btn ${i?'ghost':''}" href="${b[1]}">${b[0]}</a>`).join("")}
    </div>${d.video?VIDEO():d.art?ART:""}</div></div></section>`,
  cards: d => `<section class="sec ${d.alt?'alt':''}"><div class="wrap">
      <div class="sec-head"><h2>${d.title}</h2>${d.text?`<p>${d.text}</p>`:""}</div>
      <div class="cards">${d.items.map(i=>{
        const t = i.href?"a":"div";
        return `<${t} class="card" ${i.href?`href="${i.href}"`:""}><h3>${i.title}</h3><p>${i.text}</p>${i.href?`<span class="more">Xem chi tiết</span>`:""}</${t}>`}).join("")}</div>
    </div></section>`,
  steps: d => `<section class="sec ${d.alt?'alt':''}"><div class="wrap">
      <div class="sec-head"><h2>${d.title}</h2></div>
      <div class="steps">${d.items.map(i=>`<div class="step"><div><h3>${i.title}</h3><p>${i.text}</p></div></div>`).join("")}</div>
    </div></section>`,
  split: d => `<section class="sec ${d.alt?'alt':''}"><div class="wrap split">
      <div><h2>${d.title}</h2>${d.paras.map(p=>`<p>${p}</p>`).join("")}</div>
      <div class="panel"><h3>${d.side.title}</h3>${d.side.html}</div>
    </div></section>`,
  faq: d => `<section class="sec ${d.alt?'alt':''}"><div class="wrap">
      <div class="sec-head"><h2>${d.title}</h2></div>
      <div class="faq">${d.items.map(i=>`<details><summary>${i.q}</summary><p>${i.a}</p></details>`).join("")}</div>
    </div></section>`,
  cta: d => `<section class="cta"><div class="wrap"><h2>${d.title}</h2><p>${d.text}</p>
      <a class="btn" href="${d.button[1]}">${d.button[0]}</a></div></section>`
};

/* Mẫu landing page chi tiết: chỉ cần điền 1 mục trong FREE là có trang đầy đủ */
const landing = f => [
  {t:"hero", d:{small:true, title:f.title, text:f.desc, buttons:[["Nhận chia sẻ miễn phí","#/lien-he"],["Xem chủ đề khác","#/chia-se"]]}},
  {t:"cards", d:{title:"Bạn sẽ nhận được", items:[
    {title:"Nội dung thực tế", text:"Ví dụ và cách làm đã áp dụng, không lý thuyết dài dòng."},
    {title:"Mẫu và công cụ", text:"Biểu mẫu, checklist hoặc bảng tính dùng được ngay."},
    {title:"Hỗ trợ trao đổi", text:"Giải đáp thắc mắc qua email hoặc điện thoại."}]}},
  {t:"steps", d:{alt:true, title:"Lộ trình áp dụng", items:[
    {title:"Xác định vấn đề", text:"Chọn một công việc đang tốn nhiều thời gian nhất."},
    {title:"Làm thử quy mô nhỏ", text:"Áp dụng trong một tuần với một nhóm hoặc một quy trình."},
    {title:"Đo kết quả và mở rộng", text:"So sánh thời gian trước và sau, rồi nhân rộng."}]}},
  {t:"faq", d:{title:"Câu hỏi thường gặp", items:[
    {q:"Chia sẻ này có mất phí không?", a:"Không. Toàn bộ nội dung trong mục Chia sẻ miễn phí đều miễn phí."},
    {q:"Tôi chưa có kinh nghiệm thì có theo kịp không?", a:"Có. Nội dung được xây dựng cho người mới bắt đầu."}]}},
  {t:"cta", d:{title:"Bắt đầu từ một bước nhỏ", text:"Liên hệ để nhận tài liệu và được trao đổi trực tiếp.", button:["Liên hệ ngay","#/lien-he"]}}
];

/* =====================================================================
   CÁC TRANG: mỗi trang = danh sách module + dữ liệu
   ===================================================================== */
const freeCards = FREE.map(f=>({title:f.title, text:f.desc, href:link(f)}));
const PAGES = {
  "": {title:"Trang chủ", mods:[
    {t:"hero", d:{video:true, title:"Dữ liệu và tự động hóa giúp công việc nhẹ hơn, năng suất cao hơn",
      text:SITE.about, buttons:[["Xem chia sẻ miễn phí","#/chia-se"],["Liên hệ","#/lien-he"]]}},
    {t:"cards", d:{title:"Chia sẻ miễn phí", text:"Năm chủ đề từ kinh nghiệm thực tế, dành cho người mới bắt đầu.", items:freeCards}},
    {t:"cta", d:{title:"Bạn muốn giảm việc thủ công trong công việc của mình?", text:"Gửi câu hỏi, tôi sẽ trao đổi lại.", button:["Liên hệ","#/lien-he"]}}
  ]},
  "gioi-thieu": {title:"Giới thiệu", mods:[
    {t:"hero", d:{small:true, title:"Giới thiệu", text:"Xin chào, tôi là "+SITE.name+"."}},
    {t:"split", d:{title:"Về tôi", paras:[
      "Nội dung giới thiệu: quá trình làm việc, lĩnh vực chuyên môn và lý do bạn chia sẻ kiến thức miễn phí.",
      SITE.about],
      side:{title:"Thông tin nhanh", html:"<p>Lĩnh vực: dữ liệu, tự động hóa, quản trị.</p><p>Đối tượng: người mới bắt đầu.</p>"}}},
    {t:"cards", d:{alt:true, title:"Bạn có thể học gì ở đây", items:freeCards.slice(0,3)}},
    {t:"cta", d:{title:"Cùng trao đổi", text:"Liên hệ để kết nối.", button:["Liên hệ","#/lien-he"]}}
  ]},
  "chia-se": {title:"Chia sẻ miễn phí", mods:[
    {t:"hero", d:{small:true, title:"Chia sẻ miễn phí", text:"Chọn chủ đề phù hợp để bắt đầu."}},
    {t:"cards", d:{title:"Tất cả chủ đề", items:freeCards}}
  ]},
  "lien-he": {title:"Liên hệ", mods:[
    {t:"hero", d:{small:true, title:"Liên hệ", text:"Gửi email hoặc gọi điện, tôi sẽ phản hồi sớm nhất."}},
    {t:"cards", d:{title:"Thông tin liên hệ", items:[
      {title:"Email", text:`<a href="mailto:${SITE.email}">${SITE.email}</a>`},
      {title:"Điện thoại", text:`<a href="tel:${SITE.phone}">${SITE.phone}</a>`}]}}
  ]}
};
document.addEventListener("click", e => { const a = e.target.closest('a[href="#"]'); if (a) e.preventDefault(); });

/* =====================================================================
   RENDER (không cần sửa)
   ===================================================================== */
document.getElementById("brand").textContent = SITE.name;
const nav = document.getElementById("nav");
nav.innerHTML = MENU.map(m => m.children
  ? `<div class="dd"><button aria-haspopup="true" data-dd>${m.label} ▾</button><div class="dd-menu">
       <a href="${m.href}">Tất cả chủ đề</a>${m.children.map(c=>`<a href="${c.href}">${c.label}</a>`).join("")}</div></div>`
  : `<a href="${m.href}">${m.label}</a>`).join("");
nav.addEventListener("click", e => {
  const b = e.target.closest("[data-dd]");
  if (b) b.parentElement.classList.toggle("open");
  else if (e.target.closest("a")) { nav.classList.remove("open"); document.querySelectorAll(".dd.open").forEach(x=>x.classList.remove("open")); }
});
document.getElementById("burger").onclick = () => nav.classList.toggle("open");

document.getElementById("footer").innerHTML = `<div class="wrap">
  <div class="cols">
    <div><h3>${SITE.name}</h3><p>${SITE.about}</p></div>
    <div><h3>Chia sẻ miễn phí</h3><ul>${FREE.map(f=>`<li><a href="${link(f)}">${f.title}</a></li>`).join("")}</ul></div>
    <div><h3>Liên hệ</h3><ul>
      <li>Email: <a href="mailto:${SITE.email}">${SITE.email}</a></li>
      <li>Điện thoại: <a href="tel:${SITE.phone}">${SITE.phone}</a></li></ul></div>
  </div>
  <div class="copy">© ${new Date().getFullYear()} ${SITE.name}</div></div>`;

function render(){
  const key = location.hash.replace(/^#\/?/, "");
  const p = PAGES[key] || PAGES[""];
  document.getElementById("app").innerHTML = p.mods.map(m => M[m.t](m.d)).join("");
  document.title = (key ? p.title + " – " : "") + SITE.name;
  const top = FREE.some(f=>f.id===key) ? "#/chia-se" : "#/" + key;
  document.querySelectorAll(".nav > a, .dd > button").forEach(a => {
    const href = a.getAttribute("href");
    const on = href ? href === top : top === "#/chia-se";
    a.classList.toggle("on", on);
  });
  window.scrollTo(0,0);
}
addEventListener("hashchange", render); render();
</script>
</body>
</html>
