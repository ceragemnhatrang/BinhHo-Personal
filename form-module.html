<!-- form-module.html – Module form + Telegram dùng chung. Nạp bằng fetch vào <div id="form-module"></div> -->
<section id="consult-form" class="form-section">
  <div class="container">
    <div class="form-card">
      <span class="eyebrow" style="display:table;margin:0 auto 14px">Bắt đầu từ vấn đề của bạn</span>
      <h2>Đăng ký tư vấn miễn phí</h2>
      <p class="intro">Điền thông tin và chia sẻ vấn đề của bạn. Tôi sẽ liên hệ để trao đổi bước tiếp theo.</p>

      <form id="leadForm">
        <div class="form-group">
          <label for="name">Họ và tên *</label>
          <input id="name" type="text" name="name" required autocomplete="name" placeholder="Nguyễn Văn A">
        </div>
        <div class="form-group">
          <label for="email">Email *</label>
          <input id="email" type="email" name="email" required autocomplete="email" placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label for="phone">Số điện thoại *</label>
          <input id="phone" type="tel" name="phone" required autocomplete="tel" placeholder="0901234567">
        </div>
        <div class="form-group">
          <label for="need">Nhu cầu tư vấn</label>
          <select id="need" name="need">
            <option value="">-- Chọn nhu cầu --</option>
            <option value="Số hóa để tăng năng suất">Số hóa để tăng năng suất</option>
            <option value="Quản trị bằng dữ liệu">Quản trị bằng dữ liệu</option>
            <option value="Tối ưu quy trình vận hành">Tối ưu quy trình vận hành</option>
            <option value="Khác">Khác</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Vấn đề bạn muốn giải quyết *</label>
          <textarea id="message" name="message" rows="4" required placeholder="Mô tả ngắn tình hình hiện tại và mục tiêu bạn muốn đạt được..."></textarea>
        </div>

        <input type="hidden" name="pageUrl" id="pageUrl">
        <input type="hidden" name="pageTitle" id="pageTitle">

        <button type="submit" id="submitBtn">Gửi thông tin đăng ký</button>
        <div id="formMessage" role="status" aria-live="polite"></div>
        <p class="form-privacy">Thông tin được sử dụng để liên hệ về yêu cầu cố vấn của bạn.</p>
      </form>
    </div>
  </div>
</section>

<style>
.form-section { padding: 70px 0; background: #F8F9FA; }
.form-section .container { max-width: 680px; margin: 0 auto; padding: 0 20px; }
.form-card { background: #fff; border: 1px solid #E1E4EA; border-radius: 12px; padding: clamp(22px,4vw,38px); box-shadow: 0 12px 35px rgba(11,42,91,.06); }
.form-section h2 { text-align: center; margin-bottom: 10px; }
.form-section .intro { text-align: center; color: #666; margin-bottom: 30px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; margin-bottom: 7px; font-weight: 700; }
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%; padding: 13px; border: 1px solid #D5D9E0; border-radius: 8px;
  font: inherit; font-size: 15px; background: #fff; color: #111;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus { outline: 3px solid #D9E5FA; border-color: #0B2A5B; }
.form-group textarea { resize: vertical; }
#submitBtn {
  width: 100%; padding: 15px; background: #0B2A5B; color: #fff; border: 0;
  border-radius: 8px; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer;
}
#submitBtn:hover { background: #143A7A; }
#submitBtn:disabled { opacity: .65; cursor: wait; }
#formMessage { margin-top: 15px; text-align: center; font-weight: 600; }
.success { color: #177245; }
.error { color: #B42318; }
.form-privacy { text-align: center; color: #4B5563; font-size: 12px; margin: 14px 0 0; }
.eyebrow { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: #0B2A5B; background: #E8EEF8; border-radius: 999px; padding: 6px 11px; }
</style>
